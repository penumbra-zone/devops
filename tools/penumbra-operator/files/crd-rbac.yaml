---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: penumbra-operator
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: penumbra-operator
rules:
- apiGroups: ["penumbra.zone", "penumbra.zone/v1alpha1"]
  resources: ["penumbranodes", "penumbranetworks"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# For CRD status updates
- apiGroups: ["penumbra.zone", "penumbra.zone/v1alpha1"]
  resources: ["penumbranodes/status", "penumbranetworks/status"]
  verbs: ["get", "patch", "update"]
# For CRD finalizers
- apiGroups: ["penumbra.zone", "penumbra.zone/v1alpha1"]
  resources: ["penumbranodes/finalizers", "penumbranetworks/finalizers"]
  verbs: ["update"]
# For Pods
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# For Services
- apiGroups: [""]
  resources: ["services"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# For Events
- apiGroups: [""]
  resources: ["events"]
  verbs: ["create", "patch"]
# For ConfigMaps
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: penumbra-operator-binding
subjects:
- kind: ServiceAccount
  name: penumbra-operator
  namespace: default
roleRef:
  kind: ClusterRole
  name: penumbra-operator  # Fixed to match the ClusterRole name
  apiGroup: rbac.authorization.k8s.io
