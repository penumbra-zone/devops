[package]
name = "pindexer-db-wrangler"
description = "Tool for running pindexer against Penumbra event databases, and creating psql dump files"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1.0.96"
base64 = "0.22.1"
clap = { version = "4.5.30", features = ["derive", "color"] }
inquire = "0.7.5"
k8s-openapi = { version = "0.24.0", features = ["v1_30"] }
reqwest = { version = "0.12.12", features = ["stream", "rustls-tls-webpki-roots"] }
serde_json = "1.0.139"
tokio = "1.43.0"
tokio-stream = "0.1.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "ansi"] }
url = "2.5.4"
which = "7.0.2"

picturesque = { git = "https://github.com/penumbra-zone/penumbra", branch = "cronokirby/picturesque" }
# picturesque = { path = "/home/conor/src/pl/penumbra4/tools/picturesque" }
tempfile = "3.17.1"
sqlx = { version = "0.8.3", features = ["postgres", "json", "runtime-tokio", "tls-rustls"] }
postgres = "0.19.10"
directories = "6.0.0"
humantime = "2.1.0"
