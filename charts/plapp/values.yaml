# Default values for plapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1
strategy:
  # Set to "Recreate" to avoid running two.
  type: RollingUpdate

# Support types: Deployment, StatefulSet
deploymentKind: Deployment

# Container image details
image:
  repository: nginx
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

# Overrides for container runtime parameters.
containerCmd: []
containerEnv: []
containerEnvFromSecrets: []

# Add an optional initContainerCmd:
initContainerCmd: []

# Persistence settings; only relevant for StatefulSet.
persistence:
  enabled: false
  storageClassName:
  accessModes:
    - ReadWriteOnce
  size: 1Gi
  mountPath: /srv
  readOnly: false

# Whether to "pause" the container, keeping its volume mounted for admin operations.
maintenanceMode: false

# What command to run when maintenanceMode is enabled, instead of `containerCmd`.
maintenanceModeCmd:
  - bash
  - -c
  - |
    set -euxo pipefail
    echo "Maintenance mode is enabled"
    sleep infinity

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  port: 80
  # Disable service and corresponding readinessProbe,
  # for example if workload doesn't expose any ingress.
  enabled: true

  # Only relevant if `service.enabled=true`.
  # Whether to configure readinessProbes.
  healthCheck:
    periodSeconds: 30
    timeoutSeconds: 10
    enabled: true

# Recommended: use CRD for Traefik IngressRoute,
# so that middlewares can be used.
ingressRoute:
  enabled: false
  fqdn: ""
  secretName: ""
  annotations: {}
  middlewares: []

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

# Custom volume mounts, e.g. for mounting in a ConfigMap.
extraVolumes: []
extraVolumeMounts: []

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}
