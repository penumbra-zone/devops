{{ if eq .Values.deploymentKind "StatefulSet" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
spec:
  minReadySeconds: 10
  updateStrategy:
    type: {{ .Values.strategy.type }}
    {{- if eq .Values.strategy.type "RollingUpdate" }}
    rollingUpdate:
      partition: 0
    {{- end }}
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "plapp.selectorLabels" . | nindent 6 }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: {{ .Release.Name }}
      spec:
        accessModes: {{ .Values.persistence.accessModes }}
        storageClassName: {{ .Values.persistence.storageClassName }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "plapp.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}

      {{ if .Values.initContainerCmd }}
      initContainers:
      - image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: {{ .Release.Name }}-init
        {{- with .Values.initContainerCmd }}
        command:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with (concat .Values.containerEnv .Values.containerEnvFromSecrets) }}
        env:
          {{- toYaml . | nindent 12 }}
        {{- end }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: {{ .Release.Name }}
          mountPath: {{ .Values.persistence.mountPath }}
          readOnly: {{ .Values.persistence.readOnly }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}

      containers:
      - image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        name: {{ .Release.Name }}
        {{- if .Values.maintenanceMode }}
        {{- with .Values.maintenanceModeCmd }}
        command:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- else }}
        {{- with .Values.containerCmd }}
        command:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- with .Values.containerArgs }}
        args:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- with (concat .Values.containerEnv .Values.containerEnvFromSecrets) }}
        env:
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{ if .Values.service.enabled }}
        ports:
        - name: http
          containerPort: {{ .Values.service.port }}
        {{- if .Values.service.healthCheck.enabled }}
        readinessProbe:
          tcpSocket:
            port: {{ .Values.service.port }}
        {{- end }}
        {{- end }}
        securityContext:
          {{- toYaml .Values.podSecurityContext | nindent 10 }}
        resources:
        {{- toYaml .Values.resources | nindent 10 }}
        volumeMounts:
        {{- if .Values.persistence.enabled }}
        - name: {{ .Release.Name }}
          mountPath: {{ .Values.persistence.mountPath }}
          readOnly: {{ .Values.persistence.readOnly }}
        {{- end }}
        {{- with .Values.extraVolumeMounts }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
      {{- with .Values.extraVolumes }}
      {{- toYaml . | nindent 6 }}
      {{- end }}
{{- end }}
