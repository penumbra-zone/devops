{{- if .Values.ingressRoute.enabled -}}
{{- $fullName := include "plapp.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ $fullName }}
  labels:
    {{- include "plapp.labels" . | nindent 4 }}
  {{- with .Values.ingressRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  entryPoints:
  - websecure
  routes:
  - kind: Rule
    match: Host(`{{ .Values.ingressRoute.fqdn }}`)
    services:
    - name: {{ $fullName }}
      port: {{ $svcPort }}
    {{- with .Values.ingressRoute.middlewares }}
    middlewares:
      {{- toYaml . | nindent 6 }}
    {{- end }}
  tls:
    domains:
    - main: {{ .Values.ingressRoute.fqdn }}
    secretName: {{ .Values.ingressRoute.secretName }}
{{- end }}
